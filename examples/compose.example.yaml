# Local dependencies only; application and Celery run on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-swingpro2}
      POSTGRES_DB: ${PG_DB:-swingpro2}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in your private .env}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  postgres_data:
