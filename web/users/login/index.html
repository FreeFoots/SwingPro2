<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 - Golf 视频平台</title>
  <link rel="stylesheet" href="../../platform.css" />
  <style>
    .qr-login { margin-top: 12px; padding: 0; border: none; background: transparent; }
    .qr-login-body { display: flex; justify-content: center; align-items: center; }
    .qr-frame-wrap { position: relative; width: 100%; max-width: 360px; height: 420px; margin: 0 auto; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
    #qr-frame { width: 100%; height: 100%; border: 0; display: block; }
    .qr-expired { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.92); display: grid; place-items: center; color: #dc2626; font-weight: 600; font-size: 14px; }
  </style>
</head>
<body class="auth-page">
  <main class="auth-panel">
    <div class="auth-card" id="auth-card">
      <div class="auth-logo">
        <img src="../../assets/logo.svg" alt="logo" />
        <h1 id="auth-title">登录账户</h1>
        <p class="auth-subtitle" id="auth-subtitle">欢迎来到 Golf 视频平台</p>
      </div>
      <div class="login-switch" id="login-switch">
        <button type="button" data-method="password" class="active">密码登录</button>
        <button type="button" data-method="otp">验证码登录</button>
        <button type="button" data-method="wechat">微信扫码登录</button>
      </div>
      <form class="auth-form" id="login-form">
        <label>
          <span>账号</span>
          <input type="tel" name="telephone" placeholder="请输入手机号" required minlength="11" maxlength="11" pattern="\d{11}" />
        </label>
        <label id="login-password-row">
          <span>密码</span>
          <input type="password" name="password" placeholder="请输入密码" minlength="8" maxlength="16" pattern="(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,16}" />
        </label>
        <label id="login-otp-row" hidden>
          <span>短信验证码</span>
          <div class="otp-row">
            <input type="text" name="login_otp" id="login-otp-input" placeholder="请输入验证码" minlength="6" maxlength="6" />
            <button type="button" class="btn btn-secondary" id="login-send-otp">发送验证码</button>
          </div>
        </label>
        <button type="submit" class="btn btn-teal">登录</button>
        <div class="alert alert-error" id="login-error" hidden></div>
        <div class="alert alert-success" id="login-success" hidden></div>
      </form>

      <form class="auth-form" id="register-form" hidden>
        <label>
          <span>手机号</span>
          <input type="tel" name="telephone" placeholder="请输入手机号" required minlength="11" maxlength="11" pattern="\d{11}" />
        </label>
        <label>
          <span>密码（8-16 位，字母数字组合）</span>
          <input type="password" name="password" placeholder="请输入密码" required minlength="8" maxlength="16" pattern="(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,16}" />
        </label>
        <label>
          <span>确认密码</span>
          <input type="password" name="confirm_password" placeholder="请再次输入密码" required minlength="8" maxlength="16" pattern="(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,16}" />
        </label>
        <label>
          <span>邀请码</span>
          <input type="text" name="invite_code" placeholder="请输入邀请码" required minlength="8" maxlength="8" pattern="[a-zA-Z]{8}" />
        </label>
        <label>
          <span>短信验证码</span>
          <div class="otp-row">
            <input type="text" name="otp" placeholder="请输入验证码" required minlength="6" maxlength="6" />
            <button type="button" class="btn btn-secondary" id="send-otp">发送验证码</button>
          </div>
        </label>
        <button type="submit" class="btn btn-teal">注册并登录</button>
        <div class="alert alert-error" id="register-error" hidden></div>
        <div class="alert alert-success" id="register-success" hidden></div>
        <div class="auth-links">
          <span>已经有账号？</span>
          <button class="link-button" type="button" id="switch-login">返回登录</button>
        </div>
      </form>
      <section class="qr-login" id="qr-login" aria-label="微信扫码登录" hidden>
        <div class="qr-login-body">
          <div class="qr-frame-wrap">
            <iframe id="qr-frame" title="微信扫码登录" allowtransparency="true" scrolling="no"></iframe>
            <div class="qr-expired" id="qr-expired" hidden>二维码已过期</div>
          </div>
        </div>
      </section>

      <div class="auth-links" id="login-links-bottom">
        <span>还没有账号？</span>
        <button class="link-button" type="button" id="switch-register">注册</button>
      </div>
    </div>
  </main>
  <script>
    (function () {
      try {
        const origin = window.location.origin;
        if (origin) {
          localStorage.setItem('platformApiBase', origin);
        }
      } catch (err) {
        console.warn('Failed to set platformApiBase from origin:', err);
      }
    })();
  </script>
  <script type="module" src="./auth.js"></script>
</body>
</html>
